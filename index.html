<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="on/c — A natural-language notepad calculator inspired by Numi. Mix text, math, ans variables, live currencies, units, and safe 30-day archived sheets in your browser or on macOS."
    />
    <meta property="og:title" content="on/c — Notepad calculator that blends math with text" />
    <meta
      property="og:description"
      content="Type naturally—chain ans variables, convert currencies, insert /char symbols, and export Markdown. Private in localStorage on the web, native on macOS."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mj0lken.github.io/on-c/" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var isTauri = '__TAURI_INTERNALS__' in window;
        var resolved = 'light';
        if (isTauri) {
          var calcSaved = localStorage.getItem('onc-calc-color-scheme');
          resolved =
            calcSaved === 'system'
              ? 'light dark'
              : calcSaved === 'light'
                ? 'light'
                : 'dark';
        } else {
          var pageSaved = localStorage.getItem('onc-page-color-scheme');
          if (pageSaved === 'dark' || pageSaved === 'light') {
            resolved = pageSaved;
          } else {
            var webCalc = localStorage.getItem('onc-calc-color-scheme');
            resolved = webCalc === 'light' ? 'dark' : 'light';
          }
        }
        document.querySelector('meta[name="color-scheme"]').content = resolved;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>on/c — Natural-language notepad calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
