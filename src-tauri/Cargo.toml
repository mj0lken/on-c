[package]
name = "onc_calculator"
version = "1.0.0"
description = "on/c — Natural-language notepad calculator inspired by Numi"
authors = ["mj0lken"]
license = "MIT"
homepage = "https://mj0lken.github.io/on-c/"
repository = "https://github.com/mj0lken/on-c"
edition = "2021"

[lib]
name = "onc_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
