name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: this workflow only builds, lints, and tests.
permissions:
  contents: read

# A new push to a PR replaces its running build; every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build, lint, and test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> /tmp/onc-tauri-target"

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Verify static Pages build & /app SPA routes
        env:
          VITE_BASE_PATH: /on-c/
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/app/index.html
          test -f dist/404.html

      - name: Run Rust unit tests & Clippy lints
        env:
          CARGO_TARGET_DIR: /tmp/onc-tauri-target
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Package & verify signed macOS .app bundle
        run: |
          ./scripts/build-app.sh
          codesign --verify --strict build/on-c.app
